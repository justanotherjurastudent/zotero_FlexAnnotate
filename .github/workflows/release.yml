name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main
    # You can customize any of the inputs here.
    # If you omit an input, its default value will be used.
    with:
      build: "npm run build"
      release: "npm run release"
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- Upstream-Release-Workflow der Scaffold-Autoren, nur bei Tag-Push; GITHUB_TOKEN laesst sich nicht einzeln weiterreichen.
    secrets: inherit

<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
	<!-- Buch mit Seitenzahl-Lesezeichen und Textmarker-Strich -->
	<rect x="14" y="10" width="62" height="76" rx="6" fill="#2f5d8c"/>
	<rect x="20" y="10" width="56" height="70" rx="3" fill="#fdfdf8"/>
	<rect x="14" y="10" width="10" height="76" rx="4" fill="#244a70"/>
	<g stroke="#b9c2cc" stroke-width="3" stroke-linecap="round">
		<line x1="32" y1="26" x2="66" y2="26"/>
		<line x1="32" y1="56" x2="60" y2="56"/>
		<line x1="32" y1="66" x2="52" y2="66"/>
	</g>
	<rect x="30" y="35" width="38" height="11" rx="2" fill="#ffd400" opacity="0.85"/>

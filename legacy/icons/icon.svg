		<line x1="32" y1="40.5" x2="64" y2="40.5"/>
	</g>
	<!-- Textmarker -->
	<g transform="rotate(35 70 58)">
		<rect x="64" y="38" width="12" height="34" rx="2" fill="#e9a800"/>
		<rect x="64" y="38" width="12" height="9" rx="2" fill="#ffd400"/>
